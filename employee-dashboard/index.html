<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="dashboard-body">

    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <aside id="dashboard-sidebar" class="dashboard-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <a href="#">
                    <span class="logo-text text-white">Employee<span class="text-gold">Dashbord</span></span>
                </a>
            </div>
            <button id="close-sidebar-btn" class="close-sidebar-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="user-profile-badge">
            <div>
                <h5 id="dash-user-name" class="profile-name">Meet</h5>
                <span class="role-badge badge-employee">Employee</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link active">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard Overview</span>
            </a>
            <a href="#" class="sidebar-link">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Attendance & Leave</span>
            </a>
            <a href="#" class="sidebar-link">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>Pay Slips</span>
            </a>
            <a href="#" class="sidebar-link">
                <i class="fa-solid fa-tasks"></i>
                <span>My Projects</span>
            </a>
            <a href="#" class="sidebar-link">
                <i class="fa-solid fa-gear"></i>
                <span>Account Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a id="logout-btn" class="logout-btn" href="../index.html">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Log Out
            </a>
        </div>
    </aside>

    <div class="dashboard-main">

        <header class="dashboard-header">
            <div class="flex-center space-x-4">
                <button id="mobile-sidebar-toggle" class="sidebar-toggle-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="header-page-title">Employee Portal</h1>
            </div>

            <div class="header-right-actions">
                <button class="dash-icon-btn">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-dot"></span>
                </button>
                <div class="header-user-info">
                    <span class="user-greeting">Hello,</span>
                </div>
            </div>
        </header>

        <main class="dashboard-content">

            <div class="welcome-banner">
                <div>
                    <h2>Welcome     <span id="welcome-user-name">Employee Dashboard</span></h2>
                </div>
            </div>

        </main>
    </div>

    <script src="../assets/js/script.js"></script>
</body>

</html>
